# fly.toml app configuration file generated for wolfee-analytic on 2026-11-16T10:32:13Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'wolfee-analytic'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'immediate'
  release_command = "sh -c 'alembic upgrade head && python -m services.instrument_service'"

[env]
  APP_BASE_URL = 'https://wolfee-analytics.fly.dev'
  COOKIE_SECURE = 'true'
  CORS_ORIGINS = 'https://wolfee-analytics.fly.dev'
  REFRESH_INTERVAL_MINUTES = '30'
  REQUIRE_EMAIL_VERIFICATION = 'false'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 80
    soft_limit = 50

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
