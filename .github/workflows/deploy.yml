# Tests on every pull request to main; tests and then a Fly deploy on every push to main.
# The deploy job runs only when both test jobs pass. See docs/agents/DEPLOYMENT.md §10.
# Repository secret: FLY_API_TOKEN (a deploy token scoped to the app:
#   fly tokens create deploy -a wolfee-analytics). No other secrets are used here.
name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Python 3.11.9, PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wolfee_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-test.txt
      - name: Install dependencies (hash-checked lock file, then test-only tools)
        run: |
          python -m pip install --require-hashes -r backend/requirements.lock
          python -m pip install -r backend/requirements-test.txt
      - name: Backend suite (SQLite)
        env:
          DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/test.db
        run: python -m pytest backend/tests -q -p no:cacheprovider
      - name: API tests on PostgreSQL 16
        env:
          WOLFEE_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/wolfee_tests
        run: |
          psql -Atc "select version()"
          python -m pytest backend/tests/api -q -p no:cacheprovider -W ignore
      - name: Migrations up/down/up and alembic check on PostgreSQL 16
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wolfee_migrations
        run: |
          createdb wolfee_migrations
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend tests (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.14.0"
      - name: node --test
        working-directory: frontend
        run: node --test

  deploy:
    name: Deploy to Fly
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # One deploy at a time; a newer push waits for the running deploy instead of cancelling it
    # (cancelling mid-deploy could stop between the release command and the machine update).
    concurrency:
      group: fly-deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - name: fly deploy (release command runs migrations and the instrument seed)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only -c fly.toml -a wolfee-analytics
